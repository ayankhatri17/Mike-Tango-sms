<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoSMS - Credit Top Up</title>
<style>
  :root{
    --peach: #f4c99a;
    --peach-dark: #eab676;
    --ink: #2b2420;
    --ink-soft: #6b5f56;
    --white: #fffaf4;
    --line: rgba(43,36,32,0.15);
    --accent: #c96f34;
    --good: #2f7a4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #fdf6ee;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .card {
    width: 380px;
    background: var(--peach);
    border-radius: 14px;
    padding: 22px 22px 26px;
    box-shadow: 0 12px 30px rgba(43,36,32,0.12);
  }

  h1 {
    font-size: 19px;
    margin: 2px 0 0;
  }

  h2 {
    font-size: 16px;
    margin: 2px 0 14px;
    font-weight: 600;
  }

  select.business-select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--white);
    font-size: 14px;
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%232b2420'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  /* screen 1 list box */
  .listbox {
    background: var(--white);
    border-radius: 6px;
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .listbox-header {
    padding: 10px 12px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .listbox-body {
    max-height: 210px;
    overflow-y: auto;
  }

  .listbox-item {
    padding: 11px 14px;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(43,36,32,0.06);
  }

  .listbox-item:last-child { border-bottom: none; }

  .listbox-item:hover {
    background: rgba(201,111,52,0.08);
  }

  /* screen 2 outlets */
  .outlets-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 18px 4px 6px;
  }

  .outlet-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }

  .outlet-name {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
  }

  .outlet-sub {
    font-size: 12px;
    color: var(--ink-soft);
    font-weight: 400;
    margin-top: 1px;
  }

  .outlet-row input {
    width: 64px;
    text-align: right;
    padding: 6px 8px;
    border-radius: 5px;
    border: 1px solid var(--line);
    font-size: 14px;
  }

  .outlet-row input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px 4px;
    font-weight: 700;
    font-size: 15px;
  }

  .actions {
    margin-top: 18px;
    display: flex;
    gap: 10px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    border-radius: 7px;
    padding: 10px 16px;
    cursor: pointer;
    border: none;
  }

  .btn-back {
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
  }

  .btn-primary {
    flex: 1;
    background: var(--ink);
    color: var(--white);
    font-weight: 600;
  }

  .btn-primary:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary.loading {
    opacity: 0.75;
  }

  /* confirmation screen */
  .confirm-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--good);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 12px;
  }

  .confirm-line {
    font-size: 14px;
    line-height: 1.55;
    margin: 4px 0;
  }

  .confirm-line b { font-weight: 700; }

  .hidden { display: none; }

  .error-text {
    color: #a12f2f;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="card">

  <!-- SCREEN 1: pick a business -->
  <div id="screen1">
    <h1>SMS Top Up</h1>
    <h2>Choose Business</h2>
    <div class="listbox">
      <div class="listbox-header">- Select -</div>
      <div class="listbox-body" id="businessList"></div>
    </div>
  </div>

  <!-- SCREEN 2: outlets + top up -->
  <div id="screen2" class="hidden">
    <h1>SMS Top Up</h1>
    <h2>Choose Business</h2>
    <select class="business-select" id="businessSelect"></select>

    <div class="outlets-head">
      <span>Outlets:</span>
      <span>Top Up:</span>
    </div>
    <div id="outletList"></div>

    <div class="total-row">
      <span>Total</span>
      <span id="totalValue">0</span>
    </div>

    <div id="topupError" class="error-text hidden">Enter at least one top up amount before continuing.</div>

    <div class="actions">
      <button class="btn-back" id="backBtn">Back</button>
      <button class="btn-primary" id="nextBtn">Next</button>
    </div>
  </div>

  <!-- SCREEN 3: confirmation -->
  <div id="screen3" class="hidden">
    <div class="confirm-icon">✓</div>
    <h1 style="margin-bottom:10px;">Quotation sent</h1>
    <p class="confirm-line">A quotation for <b id="confirmTotal"></b> SMS credits has been emailed to <b id="confirmEmail"></b>.</p>
    <p class="confirm-line">Once payment clears, these credits will be added automatically to <b id="confirmBusiness"></b>'s account.</p>
    <div class="actions">
      <button class="btn-primary" id="doneBtn">Top up another business</button>
    </div>
  </div>

</div>

<script>
// Each business can span multiple legal entities, so credits are tracked
// per outlet/company rather than at the brand level.
const businesses = [
  {
    name: "Silvertree Restaurants",
    email: "accounts@silvertreerestaurants.com.my",
    outlets: [
      { name: "Binjai Park", company: "Silvertree Oris Sdn Bhd", topUp: 300 },
      { name: "Binjai Park", company: "Silvertree Oris Sdn Bhd", topUp: 300 },
      { name: "Binjai Park", company: "Silvertree Binjai Sdn Bhd", topUp: 300 },
      { name: "Union Square", company: "Silvertree US Sdn Bhd", topUp: 0 }
    ]
  },
  {
    name: "Gordon Grill",
    email: "finance@gordongrill.com.my",
    outlets: [
      { name: "Gordon Grill KLCC", company: "Gordon Grill Suria Sdn Bhd", topUp: 0 },
      { name: "Gordon Grill Bangsar", company: "Gordon Grill Bangsar Sdn Bhd", topUp: 0 }
    ]
  },
  {
    name: "Norman's Cafe",
    email: "billing@normanscafe.com",
    outlets: [
      { name: "Norman's Cafe Mont Kiara", company: "Norman F&B Sdn Bhd", topUp: 0 }
    ]
  },
  {
    name: "Nisha's Boulangerie",
    email: "hq@nishasboulangerie.com",
    outlets: [
      { name: "Nisha's Boulangerie TTDI", company: "Nisha Bakes Sdn Bhd", topUp: 0 },
      { name: "Nisha's Boulangerie Publika", company: "Nisha Bakes Sdn Bhd", topUp: 0 }
    ]
  },
  {
    name: "Binjai Juice Bar",
    email: "admin@binjaijuicebar.com",
    outlets: [
      { name: "Binjai Juice Bar", company: "Binjai Fresh Sdn Bhd", topUp: 0 }
    ]
  },
  {
    name: "Family Onigiri",
    email: "accounts@familyonigiri.com",
    outlets: [
      { name: "Family Onigiri Cheras", company: "Family Onigiri Sdn Bhd", topUp: 0 },
      { name: "Family Onigiri Setapak", company: "Family Onigiri Sdn Bhd", topUp: 0 }
    ]
  }
];

let currentBusiness = null;

const screen1 = document.getElementById("screen1");
const screen2 = document.getElementById("screen2");
const screen3 = document.getElementById("screen3");

const businessList = document.getElementById("businessList");
const businessSelect = document.getElementById("businessSelect");
const outletList = document.getElementById("outletList");
const totalValue = document.getElementById("totalValue");
const topupError = document.getElementById("topupError");

function showScreen(el) {
  [screen1, screen2, screen3].forEach(s => s.classList.add("hidden"));
  el.classList.remove("hidden");
}

function renderBusinessList() {
  businessList.innerHTML = businesses
    .map((b, i) => `<div class="listbox-item" data-index="${i}">${b.name}</div>`)
    .join("");
}

function renderBusinessSelect() {
  businessSelect.innerHTML = businesses
    .map((b, i) => `<option value="${i}" ${b === currentBusiness ? "selected" : ""}>${b.name}</option>`)
    .join("");
}

function renderOutlets() {
  outletList.innerHTML = currentBusiness.outlets
    .map((o, i) => `
      <div class="outlet-row">
        <div>
          <div class="outlet-name">${o.name}</div>
          <div class="outlet-sub">${o.company}</div>
        </div>
        <input type="number" min="0" step="1" value="${o.topUp}" data-index="${i}" class="topup-input">
      </div>
    `)
    .join("");
  updateTotal();
}

function updateTotal() {
  const total = currentBusiness.outlets.reduce((sum, o) => sum + (Number(o.topUp) || 0), 0);
  totalValue.textContent = total.toLocaleString();
}

function openBusiness(business) {
  currentBusiness = business;
  renderBusinessSelect();
  renderOutlets();
  topupError.classList.add("hidden");
  showScreen(screen2);
}

renderBusinessList();

businessList.addEventListener("click", (e) => {
  const item = e.target.closest(".listbox-item");
  if (!item) return;
  openBusiness(businesses[Number(item.dataset.index)]);
});

businessSelect.addEventListener("change", (e) => {
  openBusiness(businesses[Number(e.target.value)]);
});

outletList.addEventListener("input", (e) => {
  if (!e.target.classList.contains("topup-input")) return;
  const idx = Number(e.target.dataset.index);
  currentBusiness.outlets[idx].topUp = e.target.value === "" ? 0 : Number(e.target.value);
  updateTotal();
});

document.getElementById("backBtn").addEventListener("click", () => {
  showScreen(screen1);
});

document.getElementById("nextBtn").addEventListener("click", function () {
  const total = currentBusiness.outlets.reduce((sum, o) => sum + (Number(o.topUp) || 0), 0);

  if (total <= 0) {
    topupError.classList.remove("hidden");
    return;
  }
  topupError.classList.add("hidden");

  const btn = this;
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.classList.add("loading");
  btn.textContent = "Generating quotation...";

  // Stand-in for the Quickbooks call - generate quotation, email client,
  // then credit the SMS balance once the quotation goes out successfully.
  setTimeout(() => {
    document.getElementById("confirmTotal").textContent = total.toLocaleString() + " SMS";
    document.getElementById("confirmEmail").textContent = currentBusiness.email;
    document.getElementById("confirmBusiness").textContent = currentBusiness.name;
    showScreen(screen3);

    btn.disabled = false;
    btn.classList.remove("loading");
    btn.textContent = originalLabel;
  }, 900);
});

document.getElementById("doneBtn").addEventListener("click", () => {
  showScreen(screen1);
});
</script>

</body>
</html>
